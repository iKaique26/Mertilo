services:
  - type: web
    name: mertiloo-api
    env: node
    plan: free
    rootDir: resources/app/api
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MERTILO_ALLOWED_ORIGIN
        value: https://www.mertiloo.com.br,https://mertiloo.com.br