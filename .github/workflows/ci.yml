name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test backend
        run: |
          cd resources/app/api
          npm test
      - name: Build backend
        run: |
          cd resources/app/api
          npm run build
      - name: Build electron app (optional)
        run: |
          # If you have electron-builder configured, you can run:
          # npx electron-builder --linux --windows --mac
          echo "Skipping electron build in CI"
